[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "collector"
version = "0.1.0"
description = "Coletor de oportunidades de licitação (PNCP) para o perfil USIAR"
requires-python = ">=3.13"
dependencies = ["httpx"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

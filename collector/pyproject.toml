[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "collector"
version = "0.1.0"
description = "Coletor de oportunidades de licitação (PNCP) para o perfil USIAR"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pypdf>=5.4,<7",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "PyJWT[crypto]>=2.10,<3",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
markers = [
    "postgres: requer PostgreSQL real via DATABASE_URL",
]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: usiar
      POSTGRES_PASSWORD: usiar
      POSTGRES_DB: usiar
    ports:
      - "5433:5432"
    volumes:
      - usiar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usiar -d usiar"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  usiar_pgdata:
